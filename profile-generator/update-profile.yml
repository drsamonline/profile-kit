name: Update profile README

# Regenerates the marked regions of README.md (the badge row and the categorised
# project list) from the GitHub API, and commits the result if anything changed.
#
# Layout this expects (copy the kit's files into place first):
#   .github/scripts/update_profile.py   <- copy of profile-generator/update_profile.py
#   profile-data.json                   <- copy of profile-generator/profile-data.json
#   README.md                           <- your profile README, with the markers
#
# The owner name and the marker strings are read from profile-data.json (or the
# PROFILE_OWNER / PROFILE_*_START / PROFILE_*_END environment variables), so this
# workflow needs no editing to point it at a different account.

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate marked README regions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes — README already up to date."
          else
            git commit -m "chore: auto-update profile README"
            git push
          fi
