<style>

  *{box-sizing:border-box}

  a.btn:hover{border-color:var(--accent);color:var(--accent)}
  a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  a.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
  a.btn svg{width:17px;height:17px}
